# /etc/nginx/sites-available/doroga — статика из /var/www/doroga на порту 8093 (https)
server {
    include snippets/deny-dotfiles.conf;
    listen 8093 ssl;
    include snippets/ssl.conf;
    server_name _;

    root /var/www/doroga;
    index index.html;
    charset utf-8;

    # исключение из общей basic-авторизации сервера: игра открыта всем
    auth_basic off;

    location / {
        try_files $uri $uri/ =404;
    }
    # ассеты с хэшем в имени — кешируются надолго, index.html — нет
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # веб-приложение: манифест с правильным типом, сервис-воркер и манифест без долгого кеша
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
}
