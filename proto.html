<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <title>Прототипы транспорта</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07080a; color: #f4efe8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    .bar { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: min(720px, calc(100vw - 24px)); box-sizing: border-box;
      padding: 10px; border-radius: 16px; background: rgba(14,15,18,.6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.1); }
    .bar button, select { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.05); color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
    .bar button[aria-pressed="true"] { background: linear-gradient(100deg, #ff7a2f, #ffb35c); color: #1a0d04; border-color: transparent; }
    .picker { position: fixed; inset: calc(12px + env(safe-area-inset-top)) 12px auto;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .picker label { display: grid; gap: 6px; min-width: 0; font-size: 14px; font-weight: 700; }
    select { background: #17181c; color-scheme: dark; max-width: 100%; }
    a { color: inherit; padding: 10px 0; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <header class="picker">
    <label>Прототипы транспорта
      <select id="vehicle" aria-label="Транспорт">
        <optgroup id="player" label="Машины игрока"></optgroup>
        <optgroup id="traffic" label="Транспорт на трассе"></optgroup>
      </select>
    </label>
    <a href="./">В игру</a>
  </header>
  <div class="bar">
    <button id="liv" hidden>Страховка: нет</button>
    <button data-yaw="-0.3">Спереди ¾</button>
    <button data-yaw="-1.22">Сбоку</button>
    <button data-yaw="2.4">Сзади ¾</button>
    <button data-yaw="1.92">Другой бок</button>
    <button id="spin" aria-pressed="true">Вращение</button>
  </div>
  <script type="module" src="./src/proto.ts"></script>
</body>
</html>
